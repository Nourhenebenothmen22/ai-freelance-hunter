# Data Sources Configuration
sources:
  - source: "remoteok"
    name: "RemoteOK API"
    url: "https://remoteok.com/api"
    type: "json_api"
    enabled: true
    priority: 1
    adapter: "api_adapter"
    search_strategy: "feed_filter"
    rate_limit:
      requests_per_minute: 20
      delay_between_requests_seconds: 3
    pagination:
      supported: false
      max_pages: 1
    health: "unknown"
    last_success: null
    last_failure: null

  - source: "weworkremotely_dev"
    name: "WeWorkRemotely - Programming"
