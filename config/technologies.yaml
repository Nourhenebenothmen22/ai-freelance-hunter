rules:
  # R language strict restrictions
  r_language:
    disallowed_primary_titles:
      - "R Developer"
      - "R Programmer"
      - "R Data Engineer"
      - "R Data Analyst"
      - "Data Analyst (R)"
      - "Développeur R"
      - "Analyste R"
    disallowed_primary_patterns:
      - "(?i)\\bR\\s+required\\b"
      - "(?i)\\brequires?\\s+R\\b"
      - "(?i)\\bexpert\\s+in\\s+R\\b"
      - "(?i)\\bproficien(?:cy|t)\\s+in\\s+R\\b(?!.*python)"
      - "(?i)\\bprimary\\s+language[:\\s]+R\\b"

      - "(?i)\\bmust\\s+have[:\\s]+.*\\bR\\b"
      - "(?i)\\bR\\s+programming\\s+required\\b"
    optional_r_patterns:
      - "(?i)\\bR\\s+(?:is\\s+)?(?:a\\s+)?(?:plus|bonus|nice\\s+to\\s+have|preferred|optional)\\b"
      - "(?i)(?:plus|bonus|nice\\s+to\\s+have|preferred|optional)[:\\s]+.*\\bR\\b"
      - "(?i)python.*(?:or|and)\\s+r\\s+(?:is\\s+)?(?:a\\s+)?plus\\b"
      - "(?i)python\\s+(?:required|mandatory).*r.*(?:plus|preferred|bonus)"
